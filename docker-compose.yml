# Local Supabase-compatible Postgres for the AI Credits platform.
#
# Usage:
#   docker compose up -d db        # start the database
#   docker compose down            # stop (data persists in volume)
#   docker compose down -v         # stop and DELETE all data (fresh start)
#
# Connection string (default in .env.example):
#   postgresql://postgres:postgres@localhost:5432/postgres
#
# The schema is applied automatically on FIRST start: Postgres runs every
# *.sql file in /docker-entrypoint-initdb.d during initialization. To re-run
# migrations against an existing volume use `bun run db:migrate`.

services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: ai-credits-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Single source of truth for the schema — same files as `bun run db:migrate`.
      - ./packages/server/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  supabase-db-data:
